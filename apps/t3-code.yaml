id: t3-code
description: T3 Code, a minimal GUI for AI code agents
install:
  macos: { casks: [t3-code] }
  fedora:
    check: command -v t3-code
    # Upstream ships no rpm or flatpak for Linux, only an x86_64 AppImage.
    # The AppImage needs libfuse.so.2. The t3 server needs node, which the fnm
    # manifest installs earlier in the run; fail early and loudly if it did not.
    pre_install: |
      sudo dnf install -y fuse-libs
      if ! "$HOME/.local/share/fnm/aliases/default/bin/node" --version >/dev/null 2>&1; then
        echo "t3-code needs node ^22.16 || ^23.11 || >=24.10 from fnm, but" >&2
        echo "\$HOME/.local/share/fnm/aliases/default/bin/node is missing." >&2
        echo "Run: ./install.sh --package fnm --force" >&2
        exit 1
      fi
    script: |
      T3_CODE_VERSION="${T3_CODE_VERSION:-0.0.33}"
      case "$(uname -m)" in
        x86_64) asset="T3-Code-${T3_CODE_VERSION}-x86_64.AppImage" ;;
        *) echo "Unsupported arch for T3 Code: $(uname -m)"; exit 1 ;;
      esac
      TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
      curl -fL --retry 3 -o "$TMP/t3-code.AppImage" \
        "https://github.com/pingdotgg/t3code/releases/download/v${T3_CODE_VERSION}/${asset}"
      sudo mkdir -p /opt/t3-code
      sudo install -m 0755 "$TMP/t3-code.AppImage" /opt/t3-code/T3-Code.AppImage
      sudo ln -sf /opt/t3-code/T3-Code.AppImage /usr/local/bin/t3-code
      sudo tee /usr/share/applications/t3-code.desktop >/dev/null <<'EOF'
      [Desktop Entry]
      Type=Application
      Name=T3 Code
      Comment=Minimal GUI for AI code agents
      Exec=/opt/t3-code/T3-Code.AppImage %U
      Terminal=false
      Categories=Development;IDE;
      EOF
    post_install:
      # Headless server (systemd user unit, survives logout) so remote clients
      # can connect without a desktop session running. node comes from fnm;
      # prefer its default-alias path over the per-shell fnm_multishells
      # symlink, which does not exist for a systemd user unit.
      - |
        export PATH="$HOME/.local/share/fnm/aliases/default/bin:$PATH"
        npx -y t3@latest service install
