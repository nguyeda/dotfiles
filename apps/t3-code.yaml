id: t3-code
description: T3 Code, a minimal GUI for AI code agents
install:
  macos: { casks: [t3-code] }
  fedora:
    # Upstream ships no rpm or flatpak for Linux, only an AppImage, which needs
    # libfuse.so.2. It updates itself by overwriting its own file, so it lives in
    # a user-owned path and is only placed once here.
    check: test -x "$HOME/.local/opt/t3-code/T3-Code.AppImage"
    pre_install: sudo dnf install -y fuse-libs
    script: |
      case "$(uname -m)" in
        x86_64) arch=x86_64 ;;
        aarch64) arch=arm64 ;;
        *) echo "Unsupported arch for T3 Code: $(uname -m)"; exit 1 ;;
      esac
      url="$(curl -fsSL https://api.github.com/repos/pingdotgg/t3code/releases/latest |
        grep -oE "https://[^\"]+-${arch}\.AppImage" | head -1)"
      [ -n "$url" ] || { echo "No T3 Code AppImage found for ${arch}"; exit 1; }
      dir="$HOME/.local/opt/t3-code"
      mkdir -p "$dir" "$HOME/.local/share/applications"
      curl -fL --retry 3 -o "$dir/T3-Code.AppImage.tmp" "$url"
      chmod 0755 "$dir/T3-Code.AppImage.tmp"
      mv "$dir/T3-Code.AppImage.tmp" "$dir/T3-Code.AppImage"
      cat > "$HOME/.local/share/applications/t3-code.desktop" <<EOF
      [Desktop Entry]
      Type=Application
      Name=T3 Code
      Comment=Minimal GUI for AI code agents
      Exec=$dir/T3-Code.AppImage %U
      Terminal=false
      Categories=Development;IDE;
      EOF
