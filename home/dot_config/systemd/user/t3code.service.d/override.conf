# The unit itself is generated by `t3 service install` and takes no --host flag;
# the launcher spawns `t3 serve` with no arguments and passes its own environment
# through. T3CODE_HOST is the only lever, and a drop-in survives the rewrite that
# `t3 service update` does to the main unit on every upgrade.
#
# Default is loopback-only, which makes the server unreachable over the LAN/VPN.
#
# `::` rather than `0.0.0.0`: this host resolves `localhost` to ::1 first, and an
# IPv4-only listener leaves [::1]:3773 refused. curl hides that by falling back to
# IPv4, but SSH port forwarding - which is how the T3 app reaches the server over
# the VPN - does not. `::` binds both families.
[Service]
Environment=T3CODE_HOST=::
