id: t3-code
description: T3 Code, a minimal GUI for AI code agents
install:
  macos: { casks: [t3-code] }
  fedora:
    check: command -v t3-code
    # Upstream ships no rpm or flatpak for Linux, only an x86_64 AppImage.
    # The AppImage needs libfuse.so.2.
    pre_install: sudo dnf install -y fuse-libs
    script: |
      T3_CODE_VERSION="${T3_CODE_VERSION:-0.0.33}"
      case "$(uname -m)" in
        x86_64) asset="T3-Code-${T3_CODE_VERSION}-x86_64.AppImage" ;;
        *) echo "Unsupported arch for T3 Code: $(uname -m)"; exit 1 ;;
      esac
      TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
      curl -fL --retry 3 -o "$TMP/t3-code.AppImage" \
        "https://github.com/pingdotgg/t3code/releases/download/v${T3_CODE_VERSION}/${asset}"
      sudo mkdir -p /opt/t3-code
      sudo install -m 0755 "$TMP/t3-code.AppImage" /opt/t3-code/T3-Code.AppImage
      sudo ln -sf /opt/t3-code/T3-Code.AppImage /usr/local/bin/t3-code
      sudo tee /usr/share/applications/t3-code.desktop >/dev/null <<'EOF'
      [Desktop Entry]
      Type=Application
      Name=T3 Code
      Comment=Minimal GUI for AI code agents
      Exec=/opt/t3-code/T3-Code.AppImage %U
      Terminal=false
      Categories=Development;IDE;
      EOF
